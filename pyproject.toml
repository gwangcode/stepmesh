[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stepmesh"
version = "0.1.0"
description = "A Python package for 3D STEP multi-body boolean alignment and Gmsh tetrahedral mesh processing."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "G. Wang" }
]
keywords = [
    "cad",
    "mesh",
    "gmsh",
    "step-file",
    "boolean-fragment",
    "finite-element-mesh",
    "3d-modeling"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics"
]

dependencies = [
    "numpy>=1.20.0",
    "gmsh>=4.10.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]
dev = [
    "pytest>=7.0.0",
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/gwangcode/coplanarmesh"
Repository = "https://github.com/gwangcode/coplanarmesh.git"
"Bug Tracker" = "https://github.com/gwangcode/coplanarmesh/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["stepmesh*"]

[tool.setuptools.package-data]
stepmesh = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
